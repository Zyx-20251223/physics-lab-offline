    <!-- PWA Manifest -->

    <!-- iOS Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z'/%3E%3Cpath d='M2 12h20'/%3E%3C/svg%3E" />
    
    <!-- Using Tailwind CDN (Cached via SW) -->
    <script src="./tailwind.js"></script>
    
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
             console.log('SW registered:', reg.scope);
          }).catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
    <style>
      body {
        overscroll-behavior-y: none;
        touch-action: none;
        background-color: #1a1a1a;
        -webkit-user-select: none; 
        user-select: none;
      }
      /* Custom Range Slider Styling */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
        /* FIX: 'none' ensures browser doesn't try to scroll page when dragging slider */
        touch-action: none; 
        height: 40px; /* Larger hit area */
        cursor: pointer;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 28px; /* Even larger thumb for iPad fingers */
        width: 28px; 
        border-radius: 50%;
        background: #f97316;
        margin-top: -12px; /* (28 - 4) / 2 = 12 */
        box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
        border: 2px solid #fff; /* White border for better visibility on dark bg */
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        background: #4b5563;
        border-radius: 2px;
      }
    </style>
